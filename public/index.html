<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mistral Agents Dashboard</title>
<style>
  :root { --bg:#0f1115; --panel:#171b22; --border:#262c37; --text:#e6e9ef; --muted:#8b93a3; --accent:#ff7000; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; display:flex; height:100vh; }
  .sidebar { width:260px; background:var(--panel); border-right:1px solid var(--border); display:flex; flex-direction:column; }
  .sidebar h1 { font-size:15px; padding:16px; border-bottom:1px solid var(--border); }
  .sidebar section { padding:12px 16px; border-bottom:1px solid var(--border); overflow-y:auto; }
  .sidebar h2 { font-size:11px; text-transform:uppercase; color:var(--muted); margin-bottom:8px; letter-spacing:.05em; }
  .agent-item { padding:8px 10px; border-radius:8px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; }
  .agent-item:hover, .agent-item.active { background:#1f2530; }
  .agent-item .del { color:var(--muted); border:none; background:none; cursor:pointer; font-size:14px; }
  .run-item { padding:8px 10px; border-radius:8px; cursor:pointer; font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .run-item:hover, .run-item.active { background:#1f2530; color:var(--text); }
  .badge { font-size:10px; padding:2px 6px; border-radius:10px; }
  .badge.running { background:#3b2f00; color:#ffb020; }
  .badge.done { background:#12331a; color:#3ecf5e; }
  .badge.error { background:#3a1414; color:#ff5c5c; }
  .main { flex:1; display:flex; flex-direction:column; min-width:0; }
  .topbar { padding:12px 20px; border-bottom:1px solid var(--border); display:flex; gap:10px; align-items:center; }
  button.primary { background:var(--accent); color:#fff; border:none; padding:9px 16px; border-radius:8px; font-weight:600; cursor:pointer; }
  .content { flex:1; overflow-y:auto; padding:20px; }
  .step { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:12px; }
  .step h3 { font-size:14px; display:flex; gap:10px; align-items:center; margin-bottom:8px; }
  .step pre { white-space:pre-wrap; font-size:13px; line-height:1.5; color:#c8cdd8; font-family:inherit; }
  .chat { display:flex; flex-direction:column; height:100%; }
  .chat-log { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:75%; padding:10px 14px; border-radius:12px; white-space:pre-wrap; font-size:14px; line-height:1.5; }
  .msg.user { align-self:flex-end; background:var(--accent); color:#fff; }
  .msg.assistant { align-self:flex-start; background:var(--panel); border:1px solid var(--border); }
  .chat-form { display:flex; gap:8px; padding:14px 20px; border-top:1px solid var(--border); }
  .chat-form input { flex:1; background:var(--panel); border:1px solid var(--border); color:var(--text); padding:10px 12px; border-radius:8px; font-size:14px; }
  .empty { color:var(--muted); margin:auto; text-align:center; }
  /* --- Vue graphe animée du pipeline --- */
  .graph { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:8px; margin-bottom:16px; }
  .graph svg { width:100%; height:auto; display:block; }
  .edge { fill:none; stroke:var(--border); stroke-width:2; stroke-dasharray:6 5; }
  .edge.lit { stroke:var(--accent); stroke-dasharray:none; }
  .node .ring { fill:#10141b; stroke:var(--border); stroke-width:2; }
  .node.active .ring { stroke:var(--accent); animation:pulse 0.9s ease-in-out infinite; }
  .node.done .ring { stroke:#3ecf5e; }
  .node.error .ring { stroke:#ff5c5c; }
  .node .bot { stroke:#8b93a3; fill:#8b93a3; stroke-width:2.5; stroke-linecap:round; animation:bob 1.4s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
  .node.active .bot { stroke:var(--accent); fill:var(--accent); animation-duration:0.45s; }
  .node.done .bot { stroke:#3ecf5e; fill:#3ecf5e; animation:none; }
  .node.error .bot { stroke:#ff5c5c; fill:#ff5c5c; animation:none; }
  .node text { fill:var(--text); font-size:11px; text-anchor:middle; font-family:inherit; }
  @keyframes bob { 50% { transform:translateY(-4px); } }
  @keyframes pulse { 50% { stroke-opacity:0.25; } }
</style>
</head>
<body>
  <aside class="sidebar">
    <h1>🎬 Agents Vidéo</h1>
    <section>
      <h2>Agents</h2>
      <div id="agents"></div>
    </section>
    <section style="flex:1">
      <h2>Tâches</h2>
      <div id="runs"></div>
    </section>
  </aside>
  <main class="main">
    <div class="topbar">
      <button class="primary" id="new-task">+ Nouvelle tâche</button>
      <span id="view-title" style="color:var(--muted);font-size:13px"></span>
    </div>
    <div class="content" id="content">
      <div class="empty">Sélectionnez un agent pour discuter, ou lancez une nouvelle tâche.</div>
    </div>
  </main>
<script>
const $ = (s) => document.querySelector(s);
let agents = [], runs = [], selectedAgent = null, selectedRun = null, pollTimer = null;

async function api(path, opts) {
  const res = await fetch(path, opts && {
    headers: { "Content-Type": "application/json" },
    ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  return { status: res.status, data: await res.json().catch(() => ({})) };
}

async function refreshSidebar() {
  agents = (await api("/api/agents")).data;
  runs = (await api("/api/runs")).data;
  $("#agents").innerHTML = agents.map((a) =>
    `<div class="agent-item ${selectedAgent === a.id ? "active" : ""}" data-agent="${a.id}">
       <span>${a.name}</span>
       <button class="del" data-del="${a.id}" title="Supprimer">×</button>
     </div>`).join("");
  $("#runs").innerHTML = runs.map((r) =>
    `<div class="run-item ${selectedRun === r.id ? "active" : ""}" data-run="${r.id}">
       ${r.task} <span class="badge ${r.status}">${r.status}</span>
     </div>`).join("");
}

function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

function showChat(agent) {
  stopPolling();
  selectedRun = null; selectedAgent = agent.id;
  $("#view-title").textContent = `Chat avec ${agent.name}`;
  $("#content").innerHTML = `<div class="chat" style="height:100%">
    <div class="chat-log" id="chat-log"></div>
    <form class="chat-form" id="chat-form">
      <input id="chat-input" placeholder="Message à ${agent.name}…" autocomplete="off" />
      <button class="primary" type="submit">Envoyer</button>
    </form></div>`;
  const log = $("#chat-log");
  $("#chat-form").onsubmit = async (e) => {
    e.preventDefault();
    const text = $("#chat-input").value.trim();
    if (!text) return;
    $("#chat-input").value = "";
    log.insertAdjacentHTML("beforeend", `<div class="msg user">${esc(text)}</div>`);
    log.scrollTop = log.scrollHeight;
    const { data } = await api(`/api/agents/${agent.id}/chat`, { method: "POST", body: { message: text } });
    log.insertAdjacentHTML("beforeend",
      `<div class="msg assistant">${esc(data.reply ?? "Erreur : " + (data.error ?? ""))}</div>`);
    log.scrollTop = log.scrollHeight;
  };
  refreshSidebar();
}

function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }

function graphSvg(run) {
  const W = 1000, H = 150, y = 62, steps = run.steps ?? [];
  const n = steps.length;
  if (!n) return "";
  const xs = steps.map((_, i) => (n === 1 ? W / 2 : 80 + (i * (W - 160)) / (n - 1)));
  let edges = "", nodes = "";
  steps.forEach((s, i) => {
    const x = xs[i];
    const cls = s.status === "running" ? "active" : s.status === "done" ? "done" : s.status === "error" ? "error" : "";
    if (i > 0) {
      const x0 = xs[i - 1];
      const d = `M ${x0 + 27} ${y} C ${x0 + 75} ${y - 34}, ${x - 75} ${y - 34}, ${x - 27} ${y}`;
      const lit = s.status === "running" || s.status === "done";
      edges += `<path class="edge ${lit ? "lit" : ""}" d="${d}"/>`;
      if (s.status === "running") {
        edges += `<circle r="5" fill="var(--accent)"><animateMotion dur="0.9s" repeatCount="1" path="${d}"/></circle>`;
      }
    }
    nodes += `<g class="node ${cls}" transform="translate(${x} ${y})">
      <circle class="ring" r="24"/>
      <g class="bot">
        <circle cx="0" cy="-11" r="6" stroke="none"/>
        <line x1="0" y1="-5" x2="0" y2="7"/>
        <line x1="0" y1="-1" x2="-8" y2="5"/>
        <line x1="0" y1="-1" x2="8" y2="5"/>
        <line x1="0" y1="7" x2="-6" y2="17"/>
        <line x1="0" y1="7" x2="6" y2="17"/>
      </g>
      <text y="42">${esc(s.agentName)}</text>
    </g>`;
  });
  return `<div class="graph"><svg viewBox="0 0 ${W} ${H}">${edges}${nodes}</svg></div>`;
}

async function showRun(id, poll) {
  selectedAgent = null; selectedRun = id;
  stopPolling();
  const render = (run) => {
    $("#view-title").textContent = run.task;
    $("#content").innerHTML = graphSvg(run) + run.steps.map((s) => `
      <div class="step">
        <h3>${s.agentName} <span class="badge ${s.status}">${s.status}</span></h3>
        ${s.output ? `<pre>${esc(s.output)}</pre>` : ""}
        ${s.error ? `<pre style="color:#ff5c5c">${esc(s.error)}</pre>` : ""}
      </div>`).join("");
  };
  const tick = async () => {
    const { data: run } = await api(`/api/runs/${id}`);
    if (!run.steps) return;
    render(run);
    refreshSidebar();
    if (run.status !== "running") stopPolling();
  };
  await tick();
  if (poll) pollTimer = setInterval(tick, 2000);
}

$("#new-task").onclick = async () => {
  const task = prompt("Décrivez la vidéo de cours à produire :");
  if (!task) return;
  const { status, data } = await api("/api/runs", { method: "POST", body: { task } });
  if (status !== 201) { alert(data.error ?? "Erreur"); return; }
  await refreshSidebar();
  showRun(data.id, true);
};

$("#agents").onclick = async (e) => {
  const del = e.target.dataset.del;
  if (del) { e.stopPropagation(); await api(`/api/agents/${del}`, { method: "DELETE" }); refreshSidebar(); return; }
  const id = e.target.closest("[data-agent]")?.dataset.agent;
  if (id) showChat(agents.find((a) => a.id === id));
};

$("#runs").onclick = (e) => {
  const id = e.target.closest("[data-run]")?.dataset.run;
  if (id) showRun(id, false);
};

refreshSidebar();
</script>
</body>
</html>
